name: Deploy

on:
  push:
    branches: [staging, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy a la VM
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          BRANCH: ${{ github.ref_name }}
          PORT: ${{ github.ref_name == 'main' && '3000' || '3001' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ vars.SSH_USER || 'deploy' }}
          key: ${{ secrets.SSH_KEY }}
          envs: BRANCH,PORT
          # el clon se actualiza acá y no dentro de deploy.sh: si el script viviera solo en el repo,
          # un clon viejo (o sin el script todavía) haria fallar el deploy antes de poder traerlo
          script: |
            set -euo pipefail
            cd "/srv/pis-$BRANCH"
            git fetch --prune origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            ./deploy.sh "$BRANCH" "$PORT"
